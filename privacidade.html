<!doctype html>
<!--
  A segunda página do site: o aviso de privacidade. O Vite monta a página a
  partir daqui (ver vite.config.ts), e a Cloudflare serve em /privacidade.
  O texto mora em src/dados/privacidade.ts.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Privacidade | iDEX.</title>
    <meta
      name="description"
      content="Como a iDEX trata os dados de quem visita o site e de quem manda mensagem: o que chega, para quê, com quem passa e como pedir para ver ou apagar."
    />
    <!-- Se vier um domínio próprio, ele muda aqui também: canonical, og:url
         e og:image. -->
    <link rel="canonical" href="https://idea-dft.pages.dev/privacidade" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="iDEX." />
    <meta property="og:url" content="https://idea-dft.pages.dev/privacidade" />
    <meta property="og:title" content="Privacidade | iDEX." />
    <meta
      property="og:description"
      content="O site não guarda nada sobre você. O que chega para a iDEX é só o que você decide mandar pelo WhatsApp."
    />
    <meta property="og:image" content="https://idea-dft.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#050509" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/privacidade.tsx"></script>
  </body>
</html>

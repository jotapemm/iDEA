<!doctype html>
<!--
  A arte do anúncio da iDEX nas redes. Não é página do site. Sai daqui em
  dois formatos, parada e em movimento, e tudo vai para divulgacao/:

    ?formato=feed     1080×1350: post do Instagram e do LinkedIn
    ?formato=status   1080×1920: status do WhatsApp e story do Instagram

  O `pnpm imagens` fotografa a imagem parada (os PNGs). O `pnpm video` filma
  o plano em movimento, como no site, e grava os MP4s. O roteiro do vídeo
  está no script, no fim deste arquivo.

  É a cena da prévia do link (scripts/og.html) em pé: a marca e o endereço no
  alto, o título no meio e o plano de pontos embaixo, com a ideia roxa. No
  status, o alto e o pé da tela ficam por baixo dos botões do aplicativo,
  então nada que precise ser lido mora ali.

  No celular, o post do Instagram aparece com uns 390 px de largura, pouco
  mais de um terço do tamanho real. Por isso a letra e o ponto daqui são
  maiores que os da prévia do link.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>iDEX. | anúncio</title>
    <script>
      // O formato vem do endereço. Sem ele, sai o do feed.
      document.documentElement.dataset.formato =
        new URLSearchParams(location.search).get("formato") === "status" ? "status" : "feed";
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      :root {
        --fundo: #050509;
        --texto: #f2f2f7;
        --fraco: #a3a3b3;
        --apagado: #7f7f92;
        --ponto: #8257f5;
        /* As medidas da Archivo 800 que src/lib/medirMarca.ts lê no site. */
        --i-cap: 0.69em;
        --i-haste: 0.18em;
        --i-esq: 0.05em;
        --i-avanco: 0.288em;
        --marca-ls: -0.02em;
      }

      /* Cada formato: o tamanho da arte, onde fica o cabeçalho e onde fica o texto. */
      [data-formato="feed"] {
        --larg: 1080px;
        --alt: 1350px;
        --margem: 88px;
        --cabeca: 92px;
        --texto-topo: 280px;
        --marca: 76px;
        --titulo: 160px;
      }
      [data-formato="status"] {
        --larg: 1080px;
        --alt: 1920px;
        --margem: 96px;
        --cabeca: 290px;
        --texto-topo: 520px;
        --marca: 84px;
        --titulo: 180px;
      }

      html,
      body {
        margin: 0;
        width: var(--larg);
        height: var(--alt);
        overflow: hidden;
        background: var(--fundo);
        -webkit-font-smoothing: antialiased;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: var(--larg);
        height: var(--alt);
      }

      .cabeca,
      .texto {
        position: absolute;
        left: var(--margem);
        right: var(--margem);
        color: var(--texto);
      }
      .cabeca {
        top: var(--cabeca);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .texto {
        top: var(--texto-topo);
      }

      /* --- a marca (as mesmas regras de src/index.css) ------------------- */
      .marca {
        display: inline-block;
        font-family: "Archivo", sans-serif;
        font-size: var(--marca);
        font-weight: 800;
        font-stretch: 100%;
        letter-spacing: var(--marca-ls);
        line-height: 1;
        white-space: nowrap;
      }
      .marca-haste,
      .marca-pingo,
      .marca-ponto {
        display: inline-block;
        width: var(--i-haste);
        height: var(--i-haste);
        background: var(--ponto);
      }
      .marca-haste {
        height: calc(var(--i-cap) - var(--i-haste) * 1.5);
        margin-left: var(--i-esq);
        background: currentColor;
      }
      .marca-pingo {
        margin-left: calc(-1 * var(--i-haste));
        margin-right: calc(var(--i-avanco) - var(--i-esq) - var(--i-haste) + var(--marca-ls));
        vertical-align: calc(var(--i-cap) - var(--i-haste));
      }
      .marca-ponto {
        margin-left: calc(var(--i-haste) * 0.42);
      }

      /* --- o texto -------------------------------------------------------- */
      .endereco {
        font-family: "JetBrains Mono", monospace;
        font-size: 32px;
        letter-spacing: 0.02em;
        color: var(--apagado);
      }

      .rotulo {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0 0 36px;
        font-family: "JetBrains Mono", monospace;
        font-size: 32px;
        letter-spacing: 0.04em;
        color: var(--apagado);
      }
      .rotulo::before {
        content: "";
        width: 16px;
        height: 16px;
        background: var(--ponto);
      }

      .titulo {
        margin: 0;
        font-family: "Archivo", sans-serif;
        font-size: var(--titulo);
        font-weight: 760;
        font-stretch: 78%;
        line-height: 0.92;
        letter-spacing: -0.045em;
      }
      .ponto-final {
        display: inline-block;
        width: 0.15em;
        height: 0.15em;
        margin-left: 0.05em;
        background: var(--ponto);
      }

      /*
       * Só no status: quem responde um status cai direto na conversa com
       * você, então a arte pede a resposta. No feed, quem chama é a legenda.
       */
      .chamada {
        display: none;
        margin: 64px 0 0;
        font-family: "Archivo", sans-serif;
        font-size: 44px;
        font-weight: 500;
        line-height: 1.25;
      }
      [data-formato="status"] .chamada {
        display: block;
      }
      .chamada span {
        color: var(--fraco);
      }
    </style>
  </head>
  <body>
    <canvas id="plano"></canvas>
    <header class="cabeca">
      <span class="marca" role="img" aria-label="iDEX.">
        <span class="marca-haste"></span><span class="marca-pingo"></span>DEX<span class="marca-ponto"></span>
      </span>
      <span class="endereco">idea-dft.pages.dev</span>
    </header>
    <main class="texto">
      <p class="rotulo">automações · sistemas web · apps</p>
      <h1 class="titulo">Trabalho<br />repetido vira<br />sistema<span class="ponto-final"></span></h1>
      <p class="chamada">Qual tarefa você quer tirar das costas?<br /><span>Responda aqui.</span></p>
    </main>

    <script>
      /*
       * O plano de cada formato. `horizonte` é a fração da altura onde o chão
       * começa; o resto da câmera sai dele, na mesma proporção da prévia do
       * link. `espaco`, `grosso` e `lado` são o passo entre fileiras, a
       * espessura dos pontos e o lado da ideia, em pixels.
       */
      const FORMATOS = {
        feed: { L: 1080, A: 1350, horizonte: 0.63, alvoX: 0.74, espaco: 18, grosso: 1.9, lado: 30, brilho: 48 },
        status: { L: 1080, A: 1920, horizonte: 0.7, alvoX: 0.72, espaco: 18, grosso: 1.9, lado: 32, brilho: 52 },
      };
      const cam = FORMATOS[document.documentElement.dataset.formato];
      const { L, A } = cam;
      const TAU = Math.PI * 2;

      /* As ondas e a entrada, iguais às do Plano.tsx. */
      const VELOCIDADE = 0.0016;
      const COMPRIMENTO = 0.6;
      const PACOTE = 0.85;
      const AMPLITUDE = 0.05;
      const VIDA_ONDA = 7000;
      const ENTRADA = 1300;

      /* A imagem é o quadro parado do site: t = 9 s, com uma onda de 1,8 s no caminho. */
      const T = 9000;
      const IDADE = 1800;

      /*
       * O roteiro do vídeo (pnpm video), em ms. É o começo do site: os pontos
       * nascem espalhados, a ideia aparece, toca o plano aos 650 ms e a ordem
       * se espalha a partir dela. No site, o toque seguinte vem a cada 3,6 a
       * 4,5 s, sorteado; aqui os toques são fixos. O plano acende no começo e
       * apaga no fim, então o vídeo começa e termina só com o texto, e o loop
       * do Instagram não dá pulo.
       */
      const DURACAO = 12000;
      const TOQUES = [650, 4550, 8450];
      const ACENDE = 400;
      const APAGA = 900;

      const faixa = (v, a, b) => Math.max(0, Math.min(1, (v - a) / (b - a)));
      const saida = (v) => 1 - (1 - v) ** 3;

      /* Sorteio com semente: rodar de novo dá a mesma imagem. */
      function sorteador(semente) {
        return () => {
          semente = (semente + 0x6d2b79f5) | 0;
          let t = Math.imul(semente ^ (semente >>> 15), 1 | semente);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // O brilho dos pontos sai do sorteio de sempre, e o caos do vídeo sai de
      // outro: assim o vídeo não muda nada na imagem parada.
      const sorteio = sorteador(7);
      const acaso = sorteador(11);

      /*
       * A câmera. Na prévia do link, f é 0,984 vezes a altura do chão na tela
       * (de yPerto ao horizonte); manter essa conta mantém as ondas do mesmo
       * tamanho relativo, em qualquer formato.
       */
      const cx = L / 2;
      const horizonte = A * cam.horizonte;
      const yPerto = A * 1.06;
      const f = 0.984 * (yPerto - horizonte);
      const yLonge = horizonte + Math.max(8, (yPerto - horizonte) * 0.044);
      const Z0 = f / (yPerto - horizonte);
      const ideia = { z: Z0 * 3.2, u: 0 };
      ideia.u = ((cam.alvoX * L - cx) * ideia.z) / f;
      const U = Math.max(((L / 2 + 60) * Z0 * 5) / f, Math.abs(ideia.u) * 1.8);
      const du = (cam.espaco * Z0) / f;

      /* Os pontos do plano, fileira por fileira, da frente para o fundo. */
      const pontos = [];
      for (let y = yPerto; y > yLonge; y -= cam.espaco) {
        const z = f / (y - horizonte);
        const q = (y - yLonge) / (yPerto - yLonge);
        const pulo = Math.max(1, Math.ceil(4 / ((du * f) / z)));
        const meia = Math.min(U, ((L / 2 + 40) * z) / f);
        const n = Math.floor(meia / du);
        for (let k = -n; k <= n; k += pulo) {
          const u = k * du;
          pontos.push({
            u,
            z,
            q,
            brilho: 0.55 + sorteio() * 0.45,
            // Só o vídeo usa: onde o ponto nasce, à deriva, e quando ele
            // entra no lugar. A ordem se espalha a partir da ideia.
            caosX: acaso() * L,
            caosY: acaso() * A,
            fase: acaso() * TAU,
            atraso: 300 + Math.hypot(u - ideia.u, z - ideia.z) * 230 + acaso() * 260,
          });
        }
      }

      /*
       * Um quadro no instante `t` (ms). `ondas` são os instantes em que a
       * ideia tocou o plano. `video` liga o que só existe em movimento: a
       * entrada do caos, o mergulho da ideia a cada toque e o plano acendendo
       * e apagando.
       */
      function desenhar(ctx, t, ondas, video) {
        const luz = video ? Math.min(faixa(t, 0, ACENDE), 1 - faixa(t, DURACAO - APAGA, DURACAO)) : 1;

        for (const p of pontos) {
          let h = 0.01 * Math.sin(p.u * 1.9 + t * 0.00055) + 0.008 * Math.sin(p.z * 2.4 - t * 0.0004);
          for (const t0 of ondas) {
            const idade = t - t0;
            if (idade < 0 || idade >= VIDA_ONDA) continue;
            const d = Math.hypot(p.u - ideia.u, p.z - ideia.z) - VELOCIDADE * idade;
            if (Math.abs(d) <= 2.6 * PACOTE) {
              const envelope = Math.exp(-(d * d) / (PACOTE * PACOTE)) * Math.exp(-idade / 3800);
              h += AMPLITUDE * envelope * Math.cos((TAU * d) / COMPRIMENTO);
            }
          }

          const esc = f / p.z;
          let x = cx + p.u * esc;
          let y = horizonte + (1 - h) * esc;

          const neblina = 0.14 + 0.86 * p.q ** 1.3;
          const borda = 1 - faixa(Math.abs(p.u) / U, 0.78, 1);
          const crista = Math.max(-1, Math.min(1, h / (AMPLITUDE * 0.55)));
          let alfa = Math.min(1, 1.3 * p.brilho * neblina * borda * (0.62 + 0.38 * crista));
          const s = (1.1 + 1.4 * p.q + Math.max(0, crista) * 0.7) * cam.grosso;

          if (video) {
            // A entrada do site: do caos, à deriva, para o lugar no plano.
            const e = saida(faixa(t, p.atraso, p.atraso + ENTRADA));
            if (e < 1) {
              const vx = p.caosX + Math.sin(t * 0.0012 + p.fase) * 9 * cam.grosso;
              const vy = p.caosY + Math.cos(t * 0.001 + p.fase * 1.3) * 9 * cam.grosso;
              x = vx + (x - vx) * e;
              y = vy + (y - vy) * e;
              const aCaos = 0.1 + p.brilho * 0.22;
              alfa = aCaos + (alfa - aCaos) * e;
            }
            alfa *= luz;
          }

          ctx.fillStyle = `rgba(242,242,247,${(alfa * 0.95).toFixed(3)})`;
          ctx.fillRect(x - s / 2, y - s / 2, s, s);
        }

        /* A ideia, flutuando, e o reflexo dela no plano. */
        let altura = 0.46 + 0.03 * Math.sin(t * 0.0019);
        let lado = cam.lado;
        let vida = 1;
        if (video) {
          // Como no site: ela nasce em meio segundo e desce até quase tocar o
          // plano a cada toque. No fim, encolhe e apaga junto com o plano.
          let mergulho = 0;
          for (const t0 of ondas) mergulho += Math.exp(-(((t - t0) / (t < t0 ? 150 : 190)) ** 2));
          altura -= 0.3 * Math.min(1, mergulho);
          vida = Math.min(saida(faixa(t, 0, 500)), 1 - faixa(t, DURACAO - APAGA, DURACAO));
          lado *= 0.3 + 0.7 * vida;
        }
        const esc = f / ideia.z;
        const ix = cx + ideia.u * esc;
        ctx.fillStyle = `rgba(130,87,245,${(0.18 * vida).toFixed(3)})`;
        ctx.fillRect(ix - lado / 2, horizonte + (1 + altura * 0.3) * esc - lado * 0.3, lado, lado * 0.6);
        ctx.save();
        ctx.globalAlpha = vida;
        ctx.shadowColor = "rgba(130,87,245,0.9)";
        ctx.shadowBlur = cam.brilho;
        ctx.fillStyle = "#8257f5";
        ctx.fillRect(ix - lado / 2, horizonte + (1 - altura) * esc - lado / 2, lado, lado);
        ctx.restore();
      }

      /* A imagem parada, que o pnpm imagens fotografa. */
      const cv = document.getElementById("plano");
      const dpr = window.devicePixelRatio || 1;
      cv.width = L * dpr;
      cv.height = A * dpr;
      const ctx = cv.getContext("2d");
      ctx.scale(dpr, dpr);
      desenhar(ctx, T, [T - IDADE], false);

      /* Para o pnpm video: qualquer quadro do roteiro, já com o fundo. */
      window.anuncio = {
        L,
        A,
        DURACAO,
        quadro(ctx, t) {
          ctx.fillStyle = "#050509";
          ctx.fillRect(0, 0, L, A);
          desenhar(ctx, t, TOQUES, true);
        },
      };
    </script>
  </body>
</html>

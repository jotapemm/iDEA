<!doctype html>
<!--
  A imagem de prévia do link: o que aparece quando alguém manda o site no
  WhatsApp, no LinkedIn ou no X. Não é página do site. O `pnpm imagens`
  fotografa este arquivo em 1200×630 e grava public/og.png.

  É o hero em forma de pôster: a marca no alto, o título embaixo e o plano
  de pontos com a ideia roxa, parado no mesmo quadro que quem pede menos
  movimento vê no site. A conta do plano é a de src/componentes/telas/
  Plano.tsx, com pontos um pouco maiores: a prévia aparece pequena no
  celular, e ponto fino some quando a imagem encolhe.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>iPEX. | prévia do link</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      :root {
        --fundo: #050509;
        --texto: #f2f2f7;
        --apagado: #7f7f92;
        --ponto: #8257f5;
        /* As medidas da Archivo 800 que src/lib/medirMarca.ts lê no site. */
        --i-cap: 0.69em;
        --i-haste: 0.18em;
        --i-esq: 0.05em;
        --i-avanco: 0.288em;
        --marca-ls: -0.02em;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--fundo);
        -webkit-font-smoothing: antialiased;
      }

      canvas,
      .veu,
      .palco {
        position: absolute;
        inset: 0;
      }
      canvas {
        width: 1200px;
        height: 630px;
      }

      /* O mesmo véu do hero: segura a leitura do título por cima dos pontos. */
      .veu {
        background: linear-gradient(
          90deg,
          rgba(5, 5, 9, 0.92) 0%,
          rgba(5, 5, 9, 0.6) 34%,
          rgba(5, 5, 9, 0) 60%
        );
      }

      .palco {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 66px 80px 74px;
        color: var(--texto);
      }

      /* --- a marca (as mesmas regras de src/index.css) ------------------- */
      .marca {
        display: inline-block;
        align-self: flex-start;
        font-family: "Archivo", sans-serif;
        font-size: 46px;
        font-weight: 800;
        font-stretch: 100%;
        letter-spacing: var(--marca-ls);
        line-height: 1;
        white-space: nowrap;
      }
      .marca-haste,
      .marca-pingo,
      .marca-ponto {
        display: inline-block;
        width: var(--i-haste);
        height: var(--i-haste);
        background: var(--ponto);
      }
      .marca-haste {
        height: calc(var(--i-cap) - var(--i-haste) * 1.5);
        margin-left: var(--i-esq);
        background: currentColor;
      }
      .marca-pingo {
        margin-left: calc(-1 * var(--i-haste));
        margin-right: calc(var(--i-avanco) - var(--i-esq) - var(--i-haste) + var(--marca-ls));
        vertical-align: calc(var(--i-cap) - var(--i-haste));
      }
      .marca-ponto {
        margin-left: calc(var(--i-haste) * 0.42);
      }

      /* --- o texto -------------------------------------------------------- */
      .rotulo {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 30px;
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
        letter-spacing: 0.04em;
        color: var(--apagado);
      }
      .rotulo::before {
        content: "";
        width: 11px;
        height: 11px;
        background: var(--ponto);
      }

      .titulo {
        margin: 0;
        font-family: "Archivo", sans-serif;
        font-size: 106px;
        font-weight: 760;
        font-stretch: 78%;
        line-height: 0.92;
        letter-spacing: -0.045em;
      }
      .ponto-final {
        display: inline-block;
        width: 0.15em;
        height: 0.15em;
        margin-left: 0.05em;
        background: var(--ponto);
      }
    </style>
  </head>
  <body>
    <canvas id="plano"></canvas>
    <div class="veu"></div>
    <main class="palco">
      <span class="marca" role="img" aria-label="iPEX.">
        <span class="marca-haste"></span><span class="marca-pingo"></span>PEX<span class="marca-ponto"></span>
      </span>
      <div>
        <p class="rotulo">automações · sistemas web · apps</p>
        <h1 class="titulo">Trabalho<br />repetido vira<br />sistema<span class="ponto-final"></span></h1>
      </div>
    </main>

    <script>
      const L = 1200;
      const A = 630;
      const TAU = Math.PI * 2;

      /* Mais grosso que o site: a prévia quase sempre aparece encolhida. */
      const GROSSO = 1.45;
      const ESPACO = 14;
      const LADO_IDEIA = 22;

      /* As ondas, iguais às do Plano.tsx. */
      const VELOCIDADE = 0.0016;
      const COMPRIMENTO = 0.6;
      const PACOTE = 0.85;
      const AMPLITUDE = 0.05;

      /* O quadro parado do site: t = 9 s, com uma onda de 1,8 s no caminho. */
      const T = 9000;
      const IDADE = 1800;

      const faixa = (v, a, b) => Math.max(0, Math.min(1, (v - a) / (b - a)));

      /* Sorteio com semente: rodar de novo dá a mesma imagem. */
      let semente = 7;
      const sorteio = () => {
        semente = (semente + 0x6d2b79f5) | 0;
        let t = Math.imul(semente ^ (semente >>> 15), 1 | semente);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };

      const cv = document.getElementById("plano");
      const dpr = window.devicePixelRatio || 1;
      cv.width = L * dpr;
      cv.height = A * dpr;
      const ctx = cv.getContext("2d");
      ctx.scale(dpr, dpr);

      /* A câmera do hero no computador (camera() do Plano.tsx). */
      const cx = L / 2;
      const horizonte = A * 0.43;
      const f = A * 0.62;
      const yPerto = A * 1.06;
      const yLonge = horizonte + Math.max(8, A * 0.028);
      const Z0 = f / (yPerto - horizonte);
      const ideia = { z: Z0 * 3.2, u: 0 };
      ideia.u = ((0.77 * L - cx) * ideia.z) / f;
      const U = Math.max(((L / 2 + 60) * Z0 * 5) / f, Math.abs(ideia.u) * 1.8);
      const du = (ESPACO * Z0) / f;

      for (let y = yPerto; y > yLonge; y -= ESPACO) {
        const z = f / (y - horizonte);
        const q = (y - yLonge) / (yPerto - yLonge);
        const pulo = Math.max(1, Math.ceil(4 / ((du * f) / z)));
        const meia = Math.min(U, ((L / 2 + 40) * z) / f);
        const n = Math.floor(meia / du);
        for (let k = -n; k <= n; k += pulo) {
          const u = k * du;
          const brilho = 0.55 + sorteio() * 0.45;

          let h = 0.01 * Math.sin(u * 1.9 + T * 0.00055) + 0.008 * Math.sin(z * 2.4 - T * 0.0004);
          const d = Math.hypot(u - ideia.u, z - ideia.z) - VELOCIDADE * IDADE;
          if (Math.abs(d) <= 2.6 * PACOTE) {
            const envelope = Math.exp(-(d * d) / (PACOTE * PACOTE)) * Math.exp(-IDADE / 3800);
            h += AMPLITUDE * envelope * Math.cos((TAU * d) / COMPRIMENTO);
          }

          const esc = f / z;
          const x = cx + u * esc;
          const py = horizonte + (1 - h) * esc;

          const neblina = 0.14 + 0.86 * q ** 1.3;
          const borda = 1 - faixa(Math.abs(u) / U, 0.78, 1);
          const crista = Math.max(-1, Math.min(1, h / (AMPLITUDE * 0.55)));
          const alfa = Math.min(1, 1.3 * brilho * neblina * borda * (0.62 + 0.38 * crista));
          const s = (1.1 + 1.4 * q + Math.max(0, crista) * 0.7) * GROSSO;

          ctx.fillStyle = `rgba(242,242,247,${(alfa * 0.95).toFixed(3)})`;
          ctx.fillRect(x - s / 2, py - s / 2, s, s);
        }
      }

      /* A ideia, flutuando, e o reflexo dela no plano. */
      const altura = 0.46 + 0.03 * Math.sin(T * 0.0019);
      const esc = f / ideia.z;
      const ix = cx + ideia.u * esc;
      const lado = LADO_IDEIA;
      ctx.fillStyle = "rgba(130,87,245,0.18)";
      ctx.fillRect(ix - lado / 2, horizonte + (1 + altura * 0.3) * esc - lado * 0.3, lado, lado * 0.6);
      ctx.save();
      ctx.shadowColor = "rgba(130,87,245,0.9)";
      ctx.shadowBlur = 36;
      ctx.fillStyle = "#8257f5";
      ctx.fillRect(ix - lado / 2, horizonte + (1 - altura) * esc - lado / 2, lado, lado);
      ctx.restore();
    </script>
  </body>
</html>
